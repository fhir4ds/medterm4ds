[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medterm4ds"
version = "0.0.4"
description = "Medical terminology utilities for data science workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
    { name = "medterm4ds contributors" }
]
dependencies = [
    "duckdb>=0.9.0",
    "huggingface_hub>=0.20.0",
]

[project.scripts]
medterm4ds = "medterm4ds.apps.cli:main"
medterm4ds-mcp = "medterm4ds.apps.mcp:main"

[project.optional-dependencies]
# Backward-compat: duckdb is now a hard dep. This extra is a no-op but
# keeps `pip install medterm4ds[duckdb]` working for existing consumers.
duckdb = []
search = [
    "torch>=2.0.0",
    "transformers>=4.30.0,<5",
    "faiss-cpu>=1.7.0",
]
extraction = [
    "gliner>=0.2.28",
    "medspacy>=1.0.0",
    "transformers>=4.30.0,<5",
    # Dependency parsing for the three-signal lab-vs-med arbiter (head-noun
    # analysis + unit-type detection). medspaCy ships no parser; install the
    # spaCy model separately (not on PyPI — it lives on the spacy-models
    # index, so a uv.lock entry is impossible for all platforms):
    #   uv pip install "en-core-web-sm>=3.7,<4" --find-links https://github.com/explosion/spacy-models/releases
    # The pipeline degrades to ConText-only if the model is absent.
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
fhir = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "fhir.resources>=7.0.0",
]
mcp = [
    "fastmcp>=2.0.0",
]
dataframe = [
    "pandas>=2.0.0",
    "polars>=0.20.0",
]
all = [
    "torch>=2.0.0",
    "transformers>=4.30.0,<5",
    "faiss-cpu>=1.7.0",
    "gliner>=0.2.28",
    "medspacy>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "fhir.resources>=7.0.0",
    "fastmcp>=2.0.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
]
dev = [
    "build>=1.2.0",
    "fastapi>=0.110.0",
    "fastmcp>=2.0.0",
    "hatch>=1.14.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.5.0",
    "twine>=5.0.0",
    "uvicorn>=0.27.0",
    # Optional heavy deps are part of the tested surface in CI: the device
    # resolution tests import torch, extraction's PyRuSH sink guard touches
    # loguru, the FHIR suite needs fhir.resources, and the $extract probes
    # exercise the GLiNER pipeline.
    "torch>=2.0.0",
    "loguru>=0.7.0",
    "fhir.resources>=7.0.0",
    "gliner>=0.2.28",
    "medspacy>=1.0.0",
    "faiss-cpu>=1.7.0",
    "transformers>=4.30.0,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medterm4ds"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/Makefile",
    "/README.md",
    "/docs",
    "/notebooks",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "realdb: requires umls_current.duckdb + reports/fhir4px baseline (set MEDTERM4DS_REGRESSION_DB / MEDTERM4DS_FHIR4PX_BASELINE)",
    "slow: tests that take more than a few seconds",
    "fhir4px_smoke: runs the full fhir4px build pipeline (subprocess)",
]
addopts = "-m 'not realdb and not slow and not fhir4px_smoke'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Engine mixins consume the shared engine-base namespace via star-import
# (documented pattern; re-exporting each name explicitly would duplicate
# the base's __all__ in every mixin).
"src/medterm4ds/engines/duckdb/_mixins/*.py" = ["F405"]
"src/medterm4ds/engines/duckdb/engine.py" = ["F405"]
"src/medterm4ds/engines/duckdb/_engine_base.py" = ["F405", "E402"]
# Top-level package re-exports sit below optional-dependency try/except
# blocks by design (lazy surface; moving them up would import eagerly).
"src/medterm4ds/__init__.py" = ["E402", "F401"]
# CLI handlers import argparse subcommand helpers mid-file (grouped per
# command); __version__ re-export is a public pin.
"src/medterm4ds/apps/cli.py" = ["E402", "F401"]
# test files use star-import fixtures, broad imports, and post-importorskip
# imports deliberately
"tests/**" = ["F401", "E402"]
# These carry imports below optional-dependency guards / sys.path bootstrap
# (documented lazy patterns, same rationale as __init__.py).
"src/medterm4ds/domains/evidence.py" = ["E402"]
"src/medterm4ds/services/data_setup.py" = ["E402"]
