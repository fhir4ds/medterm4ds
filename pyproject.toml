[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medterm4ds"
version = "0.0.1"
description = "Medical terminology utilities for data science workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
    { name = "medterm4ds contributors" }
]
dependencies = []

[project.scripts]
medterm4ds = "medterm4ds.apps.cli:main"
medterm4ds-mcp = "medterm4ds.apps.mcp:main"

[project.optional-dependencies]
duckdb = [
    "duckdb>=0.9.0",
]
api = [
    "duckdb>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
mcp = [
    "duckdb>=0.9.0",
    "fastmcp>=2.0.0",
]
fhir = [
    "duckdb>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
fhir-semantic = [
    "duckdb>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "faiss-cpu>=1.7.0",
]
dataframe = [
    "pandas>=2.0.0",
    "polars>=0.20.0",
]
all = [
    "duckdb>=0.9.0",
    "fastapi>=0.110.0",
    "fastmcp>=2.0.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "uvicorn>=0.27.0",
    "medspacy>=1.0.0",
    "transformers>=4.30.0",
    "faiss-cpu>=1.7.0",
    "torch>=2.0.0",
    "rank-bm25>=0.2.2",
]
extraction = [
    "medspacy>=1.0.0",
    "transformers>=4.30.0",
]
dev = [
    "build>=1.2.0",
    "duckdb>=0.9.0",
    "fastapi>=0.110.0",
    "fastmcp>=2.0.0",
    "hatch>=1.14.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.5.0",
    "twine>=5.0.0",
    "uvicorn>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medterm4ds"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/Makefile",
    "/README.md",
    "/docs",
    "/notebooks",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "realdb: requires umls_current.duckdb + reports/fhir4px baseline (set MEDTERM4DS_REGRESSION_DB / MEDTERM4DS_FHIR4PX_BASELINE)",
    "slow: tests that take more than a few seconds",
    "fhir4px_smoke: runs the full fhir4px build pipeline (subprocess)",
]
addopts = "-m 'not realdb and not slow and not fhir4px_smoke'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
