  <line x1="92" y1="54" x2="108" y2="54" stroke="#54c6ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="64" y1="86" x2="64" y2="102" stroke="#54c6ff" stroke-width="1.5" opacity="0.5"/>
