<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="medterm4ds: branching terminology paths">
  <rect width="512" height="512" rx="104" fill="#08111f"/>

  <!-- Central trunk: the "M" formed by terminology branches -->
  <path d="M120 400 L120 180 Q120 140 145 170 L256 310 L367 170 Q392 140 392 180 L392 400"
        fill="none" stroke="#5fed83" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Branch nodes: codes at different hierarchy levels -->
  <circle cx="120" cy="150" r="18" fill="#54c6ff"/>
  <circle cx="256" cy="280" r="18" fill="#54c6ff"/>
  <circle cx="392" cy="150" r="18" fill="#54c6ff"/>

  <!-- Offshoot branches (children/descendants) -->
  <path d="M120 220 Q80 240 70 280" fill="none" stroke="#5fed83" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <circle cx="70" cy="290" r="10" fill="#5fed83" opacity="0.7"/>
  <path d="M392 220 Q432 240 442 280" fill="none" stroke="#5fed83" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <circle cx="442" cy="290" r="10" fill="#5fed83" opacity="0.7"/>

  <!-- Crosswalk arcs connecting branches -->
  <path d="M100 170 Q256 60 412 170" fill="none" stroke="#54c6ff" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  <path d="M90 190 Q256 100 422 190" fill="none" stroke="#54c6ff" stroke-width="6" stroke-linecap="round" opacity="0.2"/>

  <!-- Base: data terminal -->
  <line x1="80" y1="440" x2="432" y2="440" stroke="#f4f9ff" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
  <line x1="80" y1="458" x2="350" y2="458" stroke="#f4f9ff" stroke-width="4" stroke-linecap="round" opacity="0.15"/>
  <rect x="80" y="424" width="10" height="48" rx="5" fill="#5fed83" opacity="0.6"/>
</svg>
