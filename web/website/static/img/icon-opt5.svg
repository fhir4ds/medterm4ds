  <line x1="82" y1="76" x2="92" y2="90" stroke="#54c6ff" stroke-width="1.5" opacity="0.4"/>
  <!-- Outer nodes -->
  <circle cx="20" cy="54" r="3" fill="#f4f9ff" opacity="0.6"/>
  <circle cx="108" cy="54" r="3" fill="#f4f9ff" opacity="0.6"/>
  <circle cx="64" cy="106" r="3" fill="#f4f9ff" opacity="0.6"/>
  <circle cx="36" cy="94" r="3" fill="#f4f9ff" opacity="0.4"/>
  <circle cx="92" cy="94" r="3" fill="#f4f9ff" opacity="0.4"/>
</svg>
