<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="medterm4ds: book with terminology tree">
  <rect width="512" height="512" rx="104" fill="#08111f"/>

  <!-- Open book at the base -->
  <path d="M96 380 Q160 350 256 370 Q352 350 416 380 L416 420 Q352 390 256 410 Q160 390 96 420 Z"
        fill="none" stroke="#5fed83" stroke-width="16" stroke-linejoin="round"/>
  <!-- Book spine -->
  <line x1="256" y1="370" x2="256" y2="410" stroke="#5fed83" stroke-width="12" stroke-linecap="round"/>

  <!-- Tree trunk growing from the spine -->
  <path d="M256 370 L256 280" stroke="#5fed83" stroke-width="14" stroke-linecap="round"/>

  <!-- Branching tree (organic, flame-like curves) -->
  <!-- Left branch -->
  <path d="M256 300 Q200 280 160 240 Q140 220 130 190"
        fill="none" stroke="#5fed83" stroke-width="10" stroke-linecap="round"/>
  <path d="M200 270 Q180 250 170 230" fill="none" stroke="#5fed83" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <!-- Right branch -->
  <path d="M256 300 Q312 280 352 240 Q372 220 382 190"
        fill="none" stroke="#5fed83" stroke-width="10" stroke-linecap="round"/>
  <path d="M312 270 Q332 250 342 230" fill="none" stroke="#5fed83" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

  <!-- Flame-like top (echoing fhir4ds style) -->
  <path d="M256 280 Q230 240 240 200 Q248 170 256 140 Q264 170 272 200 Q282 240 256 280Z"
        fill="#5fed83" opacity="0.9"/>

  <!-- Terminology nodes at branch tips -->
  <circle cx="130" cy="182" r="12" fill="#54c6ff"/>
  <circle cx="170" cy="222" r="8" fill="#54c6ff" opacity="0.7"/>
  <circle cx="382" cy="182" r="12" fill="#54c6ff"/>
  <circle cx="342" cy="222" r="8" fill="#54c6ff" opacity="0.7"/>

  <!-- Crosswalk arcs between branches -->
  <path d="M140 170 Q256 100 372 170" fill="none" stroke="#54c6ff" stroke-width="5" stroke-linecap="round" opacity="0.3"/>

  <!-- "M" on the book spine -->
  <text x="256" y="404" text-anchor="middle" fill="#5fed83" font-family="serif" font-size="16" font-weight="bold" opacity="0.8">M</text>
</svg>
