[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medterm4ds"
version = "0.1.0"
description = "Batch-first medical terminology utilities for data science workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "medterm4ds contributors" }
]
dependencies = []

[project.scripts]
medterm4ds = "medterm4ds.apps.cli:main"
medterm4ds-mcp = "medterm4ds.apps.mcp:main"

[project.optional-dependencies]
duckdb = [
    "duckdb>=0.9.0",
]
api = [
    "duckdb>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]
mcp = [
    "duckdb>=0.9.0",
    "fastmcp>=2.0.0",
]
dataframe = [
    "pandas>=2.0.0",
    "polars>=0.20.0",
]
all = [
    "duckdb>=0.9.0",
    "fastapi>=0.110.0",
    "fastmcp>=2.0.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "uvicorn>=0.27.0",
]
dev = [
    "build>=1.2.0",
    "duckdb>=0.9.0",
    "fastapi>=0.110.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.5.0",
    "twine>=5.0.0",
    "uvicorn>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/medterm4ds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
