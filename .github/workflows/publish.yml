name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Trusted publishing (OIDC) — no API token needed.
# One-time setup required on PyPI:
#   1. Create account at https://pypi.org
#   2. Register project "medterm4ds" (auto-registers on first upload)
#   3. Go to https://pypi.org/manage/project/medterm4ds/settings/publishing/
#   4. Add a publisher:
#      - PyPI Project Name: medterm4ds
#      - Owner: fhir4ds
#      - Repository: medterm4ds
#      - Workflow name: publish.yml
#      - Environment name: pypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify wheel installs
        run: |
          python -m pip install dist/medterm4ds-*.whl
          python -c "import medterm4ds; print(medterm4ds.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing (OIDC)

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # If trusted publishing isn't set up yet, uncomment these lines
        # and add PYPI_API_TOKEN as a repo secret:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
