<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="medterm4ds: flame tree with network">
  <rect width="512" height="512" rx="104" fill="#08111f"/>

  <!-- Central flame-trunk (organic, echoing fhir4ds style) -->
  <path d="M256 420 Q220 360 230 300 Q236 260 244 230 Q250 200 256 170 Q262 200 268 230 Q276 260 282 300 Q292 360 256 420Z"
        fill="#5fed83" opacity="0.85"/>

  <!-- Left flowing branch (flame-like curve) -->
  <path d="M250 280 Q200 260 170 220 Q150 190 140 150 Q155 175 175 195 Q195 215 225 235 Q245 250 250 280Z"
        fill="#5fed83" opacity="0.6"/>

  <!-- Right flowing branch (flame-like curve) -->
  <path d="M262 280 Q312 260 342 220 Q362 190 372 150 Q357 175 337 195 Q317 215 287 235 Q267 250 262 280Z"
        fill="#5fed83" opacity="0.6"/>

  <!-- Smaller inner flames -->
  <path d="M253 200 Q240 180 238 155 Q244 170 250 182 Q254 192 253 200Z" fill="#54c6ff" opacity="0.7"/>
  <path d="M259 200 Q272 180 274 155 Q268 170 262 182 Q258 192 259 200Z" fill="#54c6ff" opacity="0.7"/>

  <!-- Network nodes at branch tips -->
  <circle cx="140" cy="142" r="10" fill="#54c6ff"/>
  <circle cx="372" cy="142" r="10" fill="#54c6ff"/>
  <circle cx="175" cy="190" r="6" fill="#f4f9ff" opacity="0.6"/>
  <circle cx="337" cy="190" r="6" fill="#f4f9ff" opacity="0.6"/>

  <!-- Crosswalk connections -->
  <line x1="152" y1="135" x2="360" y2="135" stroke="#54c6ff" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  <line x1="140" y1="142" x2="175" y2="190" stroke="#54c6ff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="372" y1="142" x2="337" y2="190" stroke="#54c6ff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

  <!-- Book base (subtle) -->
  <path d="M120 440 Q180 420 256 435 Q332 420 392 440" fill="none" stroke="#f4f9ff" stroke-width="6" stroke-linecap="round" opacity="0.2"/>
  <line x1="256" y1="435" x2="256" y2="455" stroke="#f4f9ff" stroke-width="4" stroke-linecap="round" opacity="0.15"/>
</svg>
