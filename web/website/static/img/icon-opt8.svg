<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="medterm4ds: terminology helix">
  <rect width="512" height="512" rx="104" fill="#08111f"/>

  <!-- DNA-like double helix = terminology + data science, with code nodes -->
  <!-- Strand 1 (green) -->
  <path d="M160 80 Q280 140 160 220 Q40 300 160 380 Q280 440 160 480"
        fill="none" stroke="#5fed83" stroke-width="18" stroke-linecap="round"/>

  <!-- Strand 2 (blue) -->
  <path d="M352 80 Q232 140 352 220 Q472 300 352 380 Q232 440 352 480"
        fill="none" stroke="#54c6ff" stroke-width="18" stroke-linecap="round"/>

  <!-- Rungs: connections between the strands (crosswalks) -->
  <line x1="185" y1="110" x2="327" y2="110" stroke="#f4f9ff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <circle cx="256" cy="110" r="14" fill="#f4f9ff" opacity="0.9"/>

  <line x1="222" y1="180" x2="290" y2="180" stroke="#f4f9ff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <circle cx="256" cy="180" r="12" fill="#5fed83"/>

  <line x1="160" y1="250" x2="352" y2="250" stroke="#f4f9ff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <circle cx="256" cy="250" r="16" fill="#54c6ff"/>

  <line x1="222" y1="320" x2="290" y2="320" stroke="#f4f9ff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <circle cx="256" cy="320" r="12" fill="#5fed83"/>

  <line x1="185" y1="390" x2="327" y2="390" stroke="#f4f9ff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <circle cx="256" cy="390" r="14" fill="#f4f9ff" opacity="0.9"/>
</svg>
