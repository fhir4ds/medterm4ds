<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="medterm4ds: interconnected code systems">
  <rect width="512" height="512" rx="104" fill="#08111f"/>

  <!-- Three overlapping circles = three code systems (Venn-style) -->
  <circle cx="200" cy="200" r="110" fill="none" stroke="#5fed83" stroke-width="16" opacity="0.8"/>
  <circle cx="312" cy="200" r="110" fill="none" stroke="#54c6ff" stroke-width="16" opacity="0.8"/>
  <circle cx="256" cy="296" r="110" fill="none" stroke="#5fed83" stroke-width="16" opacity="0.5"/>

  <!-- Center intersection: the resolved concept -->
  <circle cx="256" cy="232" r="32" fill="#5fed83"/>

  <!-- Terminal prompt inside the center -->
  <text x="256" y="242" text-anchor="middle" fill="#08111f" font-family="monospace" font-size="28" font-weight="bold">&gt;_</text>

  <!-- Connection lines extending outward = four surfaces -->
  <line x1="120" y1="140" x2="80" y2="110" stroke="#54c6ff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="392" y1="140" x2="432" y2="110" stroke="#54c6ff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="160" y1="360" x2="120" y2="400" stroke="#54c6ff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="352" y1="360" x2="392" y2="400" stroke="#54c6ff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- Surface endpoints -->
  <circle cx="72" cy="104" r="12" fill="#54c6ff" opacity="0.6"/>
  <circle cx="440" cy="104" r="12" fill="#54c6ff" opacity="0.6"/>
  <circle cx="112" cy="408" r="12" fill="#54c6ff" opacity="0.6"/>
  <circle cx="400" cy="408" r="12" fill="#54c6ff" opacity="0.6"/>
</svg>
