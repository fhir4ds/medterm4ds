name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests ${{ hashFiles('scripts/**') != '' && 'scripts' || '' }}

      - name: Test
        run: pytest -q

      - name: Notebook smoke (local scripts/ only)
        if: hashFiles('scripts/run_notebook_smoke.py') != ''
        run: python scripts/run_notebook_smoke.py

      - name: Compile
        run: python -m py_compile $(find src tests -name '*.py' -print)

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build and check package
        run: python -m build --wheel --sdist && pip install twine && twine check dist/*

      - name: Wheel install smoke
        run: |
          pip install dist/medterm4ds-*.whl
          python -c "import medterm4ds; assert medterm4ds.__version__"

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/website/package-lock.json

      - name: Install website dependencies
        working-directory: web/website
        run: npm ci

      - name: Typecheck website
        working-directory: web/website
        run: npm run typecheck

      - name: Build website
        working-directory: web/website
        run: npm run build
